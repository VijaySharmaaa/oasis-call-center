version: 0.2

env:
  variables:
    AWS_DEFAULT_REGION: ap-south-1
    # 970776445824 is the account the EC2 host, its instance role and the ECR
    # in docker-compose.yml all live in. This has been reverted to another
    # account by a merge more than once — if a deploy ever pulls an image that
    # is somehow "already up to date" after a fresh build, check here first.
    ACCOUNT_ID: "970776445824"
    BACKEND_REPO: 970776445824.dkr.ecr.ap-south-1.amazonaws.com/otr-ivr-backend
    FRONTEND_REPO: 970776445824.dkr.ecr.ap-south-1.amazonaws.com/otr-ivr-frontend

phases:
  pre_build:
    commands:
      - echo "========================================"
      - echo "Starting OTR IVR Docker Build"
      - echo "========================================"

      - echo "AWS Region: $AWS_DEFAULT_REGION"
      - echo "Account ID: $ACCOUNT_ID"
      - echo "Commit SHA: $CODEBUILD_RESOLVED_SOURCE_VERSION"

      - echo "Logging in to Amazon ECR..."
      - aws ecr get-login-password --region $AWS_DEFAULT_REGION | docker login --username AWS --password-stdin $ACCOUNT_ID.dkr.ecr.$AWS_DEFAULT_REGION.amazonaws.com

      - echo "Generating image tag..."
      - TAG=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-7)
      - echo "Image Tag: $TAG"

      - echo "Checking repository structure..."
      - pwd
      - ls -la

      - echo "Checking backend..."
      - ls -la ./backend
      - test -f ./backend/Dockerfile
      - test -f ./backend/package.json
      - test -f ./backend/package-lock.json

      - echo "Checking frontend..."
      - ls -la ./frontend
      - test -f ./frontend/Dockerfile
      # The same three the backend is checked for. The frontend Dockerfile runs
      # `npm ci`, which needs BOTH manifests and needs them to agree — the
      # backend has always been checked for its lock file and the frontend was
      # not, which is the asymmetry that let a frontend-only break through.
      - test -f ./frontend/package.json
      - test -f ./frontend/package-lock.json
      - test -f ./frontend/nginx.conf

  build:
    # WHY THIS IS HERE — the failure it prevents has already happened.
    #
    # CodeBuild runs post_build even when build FAILS. The backend is built and
    # tagged first, so a frontend build that dies still reaches the push phase
    # and ships the backend. From the outside that looks like a normal deploy:
    # a new backend image lands in ECR every time, and the frontend silently
    # stays on whatever it was.
    #
    # That is exactly what happened on 19 Aug 2026: the 13:11 build pushed
    # otr-ivr-backend:dev1 (279654d) while otr-ivr-frontend:dev1 stayed on the
    # previous commit, because the frontend `npm ci` failed on a package.json
    # that listed a dependency package-lock.json had never heard of.
    #
    # ABORT makes the build stop where it broke, so a red build means nothing
    # shipped rather than half of it.
    on-failure: ABORT
    commands:
      - echo "========================================"
      - echo "Building Backend Docker Image"
      - echo "========================================"

      - docker build -t backend:$TAG ./backend

      - echo "Tagging Backend image..."
      - docker tag backend:$TAG $BACKEND_REPO:$TAG
      - docker tag backend:$TAG $BACKEND_REPO:dev1

      - echo "========================================"
      - echo "Building Frontend Docker Image"
      - echo "========================================"

      - docker build -t frontend:$TAG ./frontend

      - echo "Tagging Frontend image..."
      - docker tag frontend:$TAG $FRONTEND_REPO:$TAG
      - docker tag frontend:$TAG $FRONTEND_REPO:dev1

  post_build:
    commands:
      - echo "========================================"
      - echo "Pushing Backend Images"
      - echo "========================================"

      - docker push $BACKEND_REPO:$TAG
      - docker push $BACKEND_REPO:dev1

      - echo "========================================"
      - echo "Pushing Frontend Images"
      - echo "========================================"

      - docker push $FRONTEND_REPO:$TAG
      - docker push $FRONTEND_REPO:dev1

      - echo "========================================"
      - echo "Creating imagedefinitions.json"
      - echo "========================================"

      - printf '[{"name":"otr-ivr-backend","imageUri":"%s"},{"name":"otr-ivr-frontend","imageUri":"%s"}]' "$BACKEND_REPO:$TAG" "$FRONTEND_REPO:$TAG" > imagedefinitions.json

      - echo "Generated imagedefinitions.json:"
      - cat imagedefinitions.json

      - echo "========================================"
      - echo "Build completed successfully"
      - echo "Backend:  $BACKEND_REPO:$TAG"
      - echo "Frontend: $FRONTEND_REPO:$TAG"
      - echo "========================================"

artifacts:
  files:
    - imagedefinitions.json
